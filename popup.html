<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SymbolGen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>SymbolGen</h1>
    </header>

    <div class="search-area">
      <input
        type="text"
        id="query"
        placeholder="ex: environ égal, flèche droite..."
        autocomplete="off"
        autofocus
      />
      <button id="searchBtn">Chercher</button>
    </div>

    <div id="errorMsg" class="error-banner hidden">
      <span id="errorText"></span>
    </div>

    <div id="spinner" class="spinner hidden"></div>

    <div id="results" class="results-grid"></div>

    <div id="favoritesSection" class="hidden">
      <div class="section-header">
        <span>Favoris</span>
        <span id="favCount" class="fav-count"></span>
      </div>
      <div id="favoritesGrid" class="results-grid"></div>
    </div>

    <div id="toast" class="toast hidden">Copié !</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
