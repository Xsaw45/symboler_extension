<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SymbolGen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>SymbolGen</h1>
      <span id="proBadge" class="pro-badge hidden">Pro</span>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="symbols" role="tab">Symboles</button>
      <button class="tab" data-tab="formula" role="tab">Formules</button>
    </div>

    <!-- Symbols pane -->
    <div id="symbolsPane" role="tabpanel">
      <div class="search-area">
        <input
          type="text"
          id="query"
          placeholder="ex: environ égal, flèche droite..."
          autocomplete="off"
          autofocus
        />
        <button id="historyBtn" class="icon-btn" title="Historique des recherches" aria-label="Historique">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="7.5" cy="7.5" r="6" stroke="currentColor" stroke-width="1.4"/>
            <path d="M7.5 4.5V7.8l2 1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="searchBtn">Chercher</button>
      </div>

      <div id="historyPanel" class="history-panel hidden">
        <div class="history-header">
          <span>Recherches récentes</span>
          <button id="clearHistoryBtn" class="clear-btn">Effacer</button>
        </div>
        <ul id="historyList" class="history-list"></ul>
      </div>

      <div id="errorMsg" class="error-banner hidden"><span id="errorText"></span></div>
      <div id="spinner" class="spinner hidden"></div>
      <div id="upgradeBar" class="upgrade-bar hidden">
        <span>Limite atteinte · <strong>5 recherches/jour</strong> en version gratuite</span>
        <button type="button" id="upgradeSymbolsBtn" class="upgrade-cta">Passer Pro</button>
      </div>

      <div id="recentSection" class="hidden">
        <div class="section-header">
          <span>Récemment utilisés</span>
        </div>
        <div id="recentGrid" class="results-grid"></div>
      </div>

      <div id="results" class="results-grid"></div>

      <div id="favoritesSection" class="hidden">
        <div class="section-header">
          <span>Favoris</span>
          <span id="favCount" class="fav-count"></span>
        </div>
        <div id="favoritesGrid" class="results-grid"></div>
      </div>
    </div>

    <!-- Formula pane -->
    <div id="formulaPane" class="hidden" role="tabpanel">
      <div class="search-area">
        <input
          type="text"
          id="formulaQuery"
          placeholder="ex: y égal 2x² plus 5..."
          autocomplete="off"
        />
        <button id="formulaBtn">Générer</button>
      </div>
      <div id="formulaError" class="error-banner hidden"><span id="formulaErrorText"></span></div>
      <div id="formulaSpinner" class="spinner hidden"></div>
      <div id="upgradeBarFormula" class="upgrade-bar hidden">
        <span>Limite atteinte · <strong>3 formules/jour</strong> en version gratuite</span>
        <button type="button" id="upgradeFormulaBtn" class="upgrade-cta">Passer Pro</button>
      </div>
      <div id="formulaResult" class="hidden">
        <div class="formula-preview">
          <div id="formulaSkeleton" class="formula-skeleton hidden"></div>
          <img id="formulaImg" src="" alt="Formule mathématique" />
        </div>
        <div class="formula-actions">
          <button id="copyLatexBtn"   class="copy-action-btn">Copier LaTeX</button>
          <button id="insertLatexBtn" class="copy-action-btn">Insérer</button>
          <button id="copySvgBtn"     class="copy-action-btn">Copier SVG</button>
          <button id="copyImgBtn"     class="copy-action-btn">Copier image</button>
        </div>
        <code id="formulaCode" class="latex-code"></code>
      </div>
    </div>

    <div id="toast" class="toast hidden">Copié !</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
